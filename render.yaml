services:
  - type: web
    name: haul-x-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: pritammajumder0416@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PEPPER
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: solar.corporation.co@gmail.com
      - key: SMTP_FROM
        value: solar.corporation.co@gmail.com
      - key: SMTP_APP_PASSWORD
        sync: false
